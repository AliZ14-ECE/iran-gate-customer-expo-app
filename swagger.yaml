openapi: 3.0.3
info:
  title: Iran Gate API
  description: |
    Iran Gate is a cross-border logistics platform that enables customers to
    request purchases from foreign suppliers, have orders processed by admins,
    tracked through warehouses via QR-code scans, and delivered locally.

    ## Roles
    | Role | Description |
    |------|-------------|
    | `customer` | End-user who creates orders and browses the catalog |
    | `admin` | Staff who manage orders, quotations, catalog, warehouses, and shipments |
    | `warehouse_operator` | Operator who scans parcels at assigned warehouse facilities |
    | `owner` | Super-admin who manages user roles (bootstrapped via CLI) |

    ## Order Lifecycle
    ```
    PENDING_QUOTATION → QUOTATION_PROVIDED → PAID → PURCHASED
      → ARRIVED_FOREIGN_WH → DEPARTED_FOREIGN_WH
      → ARRIVED_LOCAL_WH → OUT_FOR_DELIVERY → DELIVERED
    ```
    Orders can also transition to `QUOTATION_REJECTED` from `PENDING_QUOTATION`.

    Please note that this swagger file is only for `customer` endpoints.

  version: 1.0.0
  contact:
    name: Iran Gate Team

servers:
  - url: https://irangate-api.onrender.com/api/v1
    description: development
  - url: https://api.iran-gate.com
    description: Production

tags:
  - name: Health
    description: Service health check
  - name: Auth
    description: User registration and authentication
  - name: Customer - Orders
    description: Customer order management
  - name: Catalog
    description: Product catalog browsing
  - name: Notifications
    description: Push notification token management

security: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new customer account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and obtain a JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/notifications/register:
    post:
      tags: [Notifications]
      summary: Register an Expo push token
      operationId: registerPushToken
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenRequest"
      responses:
        "201":
          description: Push token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/catalog:
    get:
      tags: [Catalog]
      summary: Browse the public product catalog
      operationId: browseCatalog
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of public products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProducts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orders:
    post:
      tags: [Customer - Orders]
      summary: Create a new purchase order
      operationId: createOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    get:
      tags: [Customer - Orders]
      summary: List the customer's orders
      operationId: listCustomerOrders
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of customer orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrders"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orders/{orderID}:
    get:
      tags: [Customer - Orders]
      summary: Get a specific customer order
      operationId: getCustomerOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrderIDParam"
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from `/api/v1/auth/login` or `/api/v1/auth/register`.
        Include as `Authorization: Bearer <token>`.
        Claims contain `sub` (user ID), `email`, `role`, and standard JWT fields.

  # ──────────────────────────────────────────────
  # Reusable Parameters
  # ──────────────────────────────────────────────
  parameters:
    OrderIDParam:
      name: orderID
      in: path
      required: true
      description: UUID of the order
      schema:
        type: string
        format: uuid

    ProductIDParam:
      name: productID
      in: path
      required: true
      description: UUID of the product
      schema:
        type: string
        format: uuid

    WarehouseIDParam:
      name: warehouseID
      in: path
      required: true
      description: UUID of the warehouse
      schema:
        type: string
        format: uuid

    UserIDParam:
      name: userID
      in: path
      required: true
      description: UUID of the target user
      schema:
        type: string
        format: uuid

    PageParam:
      name: page
      in: query
      required: false
      description: Page number (default 1)
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      required: false
      description: Items per page (default 20, max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    StatusFilterParam:
      name: status
      in: query
      required: false
      description: Filter orders by status
      schema:
        $ref: "#/components/schemas/OrderStatus"

  # ──────────────────────────────────────────────
  # Schemas
  # ──────────────────────────────────────────────
  schemas:
    # ── Enums ──
    OrderStatus:
      type: string
      enum:
        - PENDING_QUOTATION
        - QUOTATION_PROVIDED
        - QUOTATION_REJECTED
        - PAID
        - PURCHASED
        - ARRIVED_FOREIGN_WH
        - DEPARTED_FOREIGN_WH
        - ARRIVED_LOCAL_WH
        - OUT_FOR_DELIVERY
        - DELIVERED

    UserRole:
      type: string
      enum:
        - customer
        - admin
        - warehouse_operator
        - owner

    AssignableRole:
      type: string
      description: Roles that the owner can assign (excludes `owner`)
      enum:
        - customer
        - admin
        - warehouse_operator

    WarehouseType:
      type: string
      enum:
        - foreign
        - local

    ScanActionType:
      type: string
      enum:
        - check_in
        - check_out

    # ── Core Models ──
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - created_at

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/OrderStatus"
        source_url:
          type: string
          format: uri
        title:
          type: string
        description:
          type: string
          nullable: true
        image_urls:
          type: array
          items:
            type: string
            format: uri
        declared_price:
          type: number
          format: double
          nullable: true
        verified_price:
          type: number
          format: double
          nullable: true
        declared_shipping_fee:
          type: number
          format: double
          nullable: true
          description: Customer-declared shipping fee estimate
        verified_shipping_fee:
          type: number
          format: double
          nullable: true
          description: Admin-verified final shipping fee
        declared_weight:
          type: number
          format: double
          nullable: true
          description: Customer-declared weight estimate (in kg)
        verified_weight:
          type: number
          format: double
          nullable: true
          description: Admin-verified final weight (in kg)
        declared_volume:
          type: number
          format: double
          nullable: true
          description: Customer-declared volume estimate (in cubic cm)
        verified_volume:
          type: number
          format: double
          nullable: true
          description: Admin-verified final volume (in cubic cm)
        supplier_tracking_number:
          type: string
          nullable: true
        transit_shipment_id:
          type: string
          format: uuid
          nullable: true
        current_warehouse_id:
          type: string
          format: uuid
          nullable: true
        quantity:
          type: integer
          minimum: 1
          default: 1
          description: Number of units requested for this product
          example: 2
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - customer_id
        - status
        - source_url
        - title
        - created_at
        - updated_at

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        source_url:
          type: string
          format: uri
          nullable: true
        image_urls:
          type: array
          items:
            type: string
            format: uri
        price:
          type: number
          format: double
          nullable: true
        weight:
          type: number
          format: double
          nullable: true
        volume:
          type: number
          format: double
          nullable: true
        is_public:
          type: boolean
      required:
        - id
        - title
        - is_public

    TransitShipment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        vehicle_type:
          type: string
          nullable: true
        vehicle_plate:
          type: string
          nullable: true
        driver_name:
          type: string
          nullable: true
        driver_phone:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - created_at

    Warehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        location:
          type: string
        type:
          $ref: "#/components/schemas/WarehouseType"
      required:
        - id
        - name
        - location
        - type

    WarehouseAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        warehouse_id:
          type: string
          format: uuid
      required:
        - id
        - user_id
        - warehouse_id

    WarehouseScan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        warehouse_id:
          type: string
          format: uuid
        operator_id:
          type: string
          format: uuid
        action_type:
          $ref: "#/components/schemas/ScanActionType"
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - order_id
        - warehouse_id
        - operator_id
        - action_type
        - timestamp

    # ── Request Bodies ──
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          example: "Ali Zafar"
        email:
          type: string
          format: email
          example: "ali@example.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "securepassword123"
      required:
        - name
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "ali@example.com"
        password:
          type: string
          format: password
          example: "securepassword123"
      required:
        - email
        - password

    CreateOrderRequest:
      type: object
      properties:
        source_url:
          type: string
          format: uri
          description: URL of the product on the foreign supplier's website
          example: "https://www.amazon.com/dp/B09V3KXJPB"
        title:
          type: string
          description: Short title for the order
          example: "Sony WH-1000XM5 Headphones"
        description:
          type: string
          nullable: true
          description: Optional detailed description
          example: "Black color, noise-cancelling"
        image_urls:
          type: array
          items:
            type: string
            format: uri
          description: Optional product image URLs
        quantity:
          type: integer
          minimum: 1
          default: 1
          description: Number of units requested for this product (defaults to 1)
          example: 2
        declared_price:
          type: number
          format: double
          nullable: true
          description: Customer-declared estimated price per unit
          example: 349.99
        declared_weight:
          type: number
          format: double
          nullable: true
          description: Estimated weight in kg
          example: 0.5
        declared_volume:
          type: number
          format: double
          nullable: true
          description: Estimated volume in cubic cm
          example: 1200.0
        declared_shipping_fee:
          type: number
          format: double
          nullable: true
          description: Estimated shipping fee
          example: 25.00
      required:
        - source_url
        - title

    UpdateQuotationRequest:
      type: object
      properties:
        verified_price:
          type: number
          format: double
          nullable: true
          description: Admin-verified product price
          example: 355.00
        verified_shipping_fee:
          type: number
          format: double
          nullable: true
          description: Final shipping fee
          example: 25.00
        verified_weight:
          type: number
          format: double
          nullable: true
          description: Verified weight in kg
          example: 0.5
        verified_volume:
          type: number
          format: double
          nullable: true
          description: Verified volume in cubic cm
          example: 1200.0

    UpdatePurchaseRequest:
      type: object
      properties:
        supplier_tracking_number:
          type: string
          description: Tracking number from the supplier
          example: "1Z999AA10123456784"
      required:
        - supplier_tracking_number

    AttachShipmentRequest:
      type: object
      properties:
        transit_shipment_id:
          type: string
          format: uuid
          description: ID of the transit shipment to link
      required:
        - transit_shipment_id

    CreateTransitShipmentRequest:
      type: object
      properties:
        vehicle_type:
          type: string
          nullable: true
          example: "truck"
        vehicle_plate:
          type: string
          nullable: true
          example: "12-ABC-345"
        driver_name:
          type: string
          nullable: true
          example: "Mohammad Rezaei"
        driver_phone:
          type: string
          nullable: true
          example: "+98-912-345-6789"
        notes:
          type: string
          nullable: true
          example: "Crosses border at Bazargan checkpoint"

    CreateProductRequest:
      type: object
      properties:
        title:
          type: string
          example: "iPhone 15 Pro Max"
        description:
          type: string
          nullable: true
          example: "256GB Natural Titanium"
        source_url:
          type: string
          format: uri
          nullable: true
          example: "https://www.apple.com/shop/buy-iphone"
        image_urls:
          type: array
          items:
            type: string
            format: uri
        price:
          type: number
          format: double
          nullable: true
          example: 1199.00
        weight:
          type: number
          format: double
          nullable: true
          example: 0.221
        volume:
          type: number
          format: double
          nullable: true
          example: 320.0
        is_public:
          type: boolean
          description: Whether the product is visible in the public catalog
          example: true
      required:
        - title

    UpdateProductRequest:
      type: object
      description: All fields are optional; only provided fields are updated.
      properties:
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        source_url:
          type: string
          format: uri
          nullable: true
        image_urls:
          type: array
          items:
            type: string
            format: uri
        price:
          type: number
          format: double
          nullable: true
        weight:
          type: number
          format: double
          nullable: true
        volume:
          type: number
          format: double
          nullable: true
        is_public:
          type: boolean
          nullable: true

    CreateWarehouseRequest:
      type: object
      properties:
        name:
          type: string
          example: "Istanbul Hub"
        location:
          type: string
          example: "Istanbul, Turkey"
        type:
          $ref: "#/components/schemas/WarehouseType"
      required:
        - name
        - location
        - type

    AssignOperatorRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: ID of the user with `warehouse_operator` role
      required:
        - user_id

    UpdateRoleRequest:
      type: object
      properties:
        role:
          $ref: "#/components/schemas/AssignableRole"
      required:
        - role

    ScanRequest:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
          description: UUID of the order (from QR code)
        warehouse_id:
          type: string
          format: uuid
          description: UUID of the warehouse where the scan occurs
        action_type:
          $ref: "#/components/schemas/ScanActionType"
      required:
        - order_id
        - warehouse_id
        - action_type

    PushTokenRequest:
      type: object
      properties:
        expo_push_token:
          type: string
          description: Expo push notification token from the mobile device
          example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
      required:
        - expo_push_token

    # ── Response Bodies ──
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    PaginatedOrders:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        page:
          type: integer
        limit:
          type: integer
        total_count:
          type: integer
      required:
        - data
        - page
        - limit
        - total_count

    PaginatedProducts:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page:
          type: integer
        limit:
          type: integer
        total_count:
          type: integer
      required:
        - data
        - page
        - limit
        - total_count

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    StatusMessageResponse:
      type: object
      properties:
        message:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
      required:
        - message
        - status

    RoleUpdateResponse:
      type: object
      properties:
        message:
          type: string
        user_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/AssignableRole"
      required:
        - message
        - user_id
        - role

    ScanResponse:
      type: object
      properties:
        message:
          type: string
        new_status:
          $ref: "#/components/schemas/OrderStatus"
        scan:
          $ref: "#/components/schemas/WarehouseScan"
      required:
        - message
        - new_status
        - scan

    UploadResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Public URL of the uploaded file
        key:
          type: string
          description: S3 object key
      required:
        - url
        - key

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        environment:
          type: string
          example: "development"
      required:
        - status
        - environment

    APIError:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
      required:
        - error

  # ──────────────────────────────────────────────
  # Reusable Responses
  # ──────────────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            error: "name, email, and password are required"

    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            error: "missing authorization header"

    Forbidden:
      description: Insufficient permissions for this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            error: "forbidden: insufficient permissions"

    NotFound:
      description: Requested resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            error: "order not found"

    Conflict:
      description: Resource already exists (duplicate key)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            error: "email already registered"

    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          example:
            error: "failed to create user"
